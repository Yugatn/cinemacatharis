[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-catharsis"
version = "0.3.0"
description = "Explainable pre-upload video annotations and monetization policy prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / repository license applies"}
dependencies = []

[project.scripts]
cinema-catharsis = "cinema_catharsis.cli:main"
cinema-catharsis-preflight = "cinema_catharsis.preflight:main"
cinema-catharsis-server = "cinema_catharsis.server:main"

[tool.setuptools.packages.find]
where = ["src"]
