name: Browser lexical engine tests
on:
  push:
    branches: [main, feature/research-engine-v1]
  pull_request:
jobs:
  lexical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/js/*.test.mjs
